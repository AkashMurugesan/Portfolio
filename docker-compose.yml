# Full stack on real Postgres: docker compose up --build
# For Postgres only (with `npm run dev`): docker compose up -d db
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
    depends_on:
      db: { condition: service_healthy }

  app:
    build: { context: ., target: runner }
    env_file: [.env.local]
    environment:
      DATABASE_URL: postgres://portfolio:portfolio@db:5432/portfolio
      AUTH_TRUST_HOST: "true"
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }

volumes:
  pgdata:
